<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title V Block Grant Review Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #366092;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #366092;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .meta {
            font-size: 12px;
            color: #999;
            font-style: italic;
        }

        nav {
            margin: 30px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        nav button {
            padding: 8px 16px;
            border: 1px solid #366092;
            background-color: white;
            color: #366092;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        nav button:hover {
            background-color: #366092;
            color: white;
        }

        .phase {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background-color: white;
        }

        .phase-header {
            background-color: #366092;
            color: white;
            padding: 15px 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }

        .phase-header:hover {
            background-color: #2a4d6f;
        }

        .phase-header.phase-1 {
            background-color: #4472C4;
        }

        .phase-header.phase-1:hover {
            background-color: #366092;
        }

        .phase-header.phase-2a {
            background-color: #70AD47;
        }

        .phase-header.phase-2a:hover {
            background-color: #548235;
        }

        .phase-header.phase-2b {
            background-color: #C65911;
        }

        .phase-header.phase-2b:hover {
            background-color: #9d4409;
        }

        .toggle-icon {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .phase.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .phase-content {
            max-height: 10000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .phase.collapsed .phase-content {
            max-height: 0;
        }

        .week {
            margin-bottom: 20px;
            padding: 15px 20px;
            background-color: #f5f5f5;
            border-left: 4px solid #4472C4;
        }

        .week.phase-2b {
            border-left-color: #C65911;
        }

        .week h3 {
            font-size: 13px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day {
            margin-bottom: 15px;
            padding: 12px;
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            border-left: 3px solid #4472C4;
        }

        .day.phase-2b {
            border-left-color: #C65911;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .date-day {
            font-weight: bold;
            color: #366092;
            font-size: 14px;
        }

        .time-block {
            font-size: 12px;
            color: #666;
            font-style: italic;
            background-color: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .form-section {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .tasks {
            margin-top: 8px;
        }

        .task {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
            font-size: 13px;
            padding: 4px 0;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-text {
            flex-grow: 1;
            line-height: 1.4;
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .progress-bar {
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: #70AD47;
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .progress-text {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .clear-button {
            display: block;
            margin: 30px auto 0;
            padding: 10px 20px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
        }

        .clear-button:hover {
            background-color: #d0d0d0;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .phase-header {
                font-size: 13px;
            }

            .day-header {
                flex-direction: column;
                gap: 5px;
            }

            nav {
                gap: 5px;
            }

            nav button {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
    </style>
</head>

        function renderSchedule() {
            const container = document.getElementById('schedule');
            let totalTasks = 0;
            
            scheduleData.forEach(phase => {
                const phaseDiv = document.createElement('div');
                phaseDiv.className = `phase ${phase.phase}`;
                phaseDiv.id = phase.phase;
                
                const headerClass = phase.phase === 'phase-2b' ? 'phase-header phase-2b' : `phase-header ${phase.phase}`;
                const phaseHeader = document.createElement('div');
                phaseHeader.className = headerClass;
                phaseHeader.innerHTML = `<span>${phase.phaseName}</span><span class="toggle-icon">▼</span>`;
                phaseHeader.onclick = () => togglePhase(phaseDiv);
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'phase-content';
                
                phase.weeks.forEach((week, weekIndex) => {
                    if (week.weekName) {
                        const weekDiv = document.createElement('div');
                        const weekClass = phase.phase === 'phase-2b' ? 'week phase-2b' : 'week';
                        weekDiv.className = weekClass;
                        weekDiv.innerHTML = `<h3>${week.weekName}</h3>`;
                        
                        week.days.forEach(day => {
                            totalTasks += day.tasks.length;
                            const dayDiv = document.createElement('div');
                            const dayClass = phase.phase === 'phase-2b' ? 'day phase-2b' : 'day';
                            dayDiv.className = dayClass;
                            
                            let dayHTML = `
                                <div class="day-header">
                                    <span class="date-day">${day.date} • ${day.day}</span>
                                    <span class="time-block">${day.time}</span>
                                </div>
                                <div class="form-section">${day.section}</div>
                                <div class="tasks">
                            `;
                            
                            day.tasks.forEach((task, taskIndex) => {
                                const taskId = `task-${phase.phase}-${weekIndex}-${day.date.replace(/\//g, '-')}-${taskIndex}`;
                                dayHTML += `
                                    <div class="task" id="${taskId}">
                                        <input type="checkbox" class="task-checkbox" onchange="toggleTask(this, '${taskId}'); updateProgress();">
                                        <span class="task-text">${task}</span>
                                    </div>
                                `;
                            });
                            
                            dayHTML += '</div>';
                            dayDiv.innerHTML = dayHTML;
                            weekDiv.appendChild(dayDiv);
                        });
                        
                        contentDiv.appendChild(weekDiv);
                    }
                });
                
                phaseDiv.appendChild(phaseHeader);
                phaseDiv.appendChild(contentDiv);
                container.appendChild(phaseDiv);
            });
            
            document.getElementById('total').textContent = totalTasks;
            loadCheckboxState();
            updateProgress();
        }

        function togglePhase(phaseDiv) {
            phaseDiv.classList.toggle('collapsed');
        }

        function toggleTask(checkbox, taskId) {
            const taskElement = document.getElementById(taskId);
            if (checkbox.checked) {
                taskElement.classList.add('completed');
            } else {
                taskElement.classList.remove('completed');
            }
            saveCheckboxState();
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.task-checkbox');
            const checked = document.querySelectorAll('.task-checkbox:checked').length;
            const total = checkboxes.length;
            const percentage = Math.round((checked / total) * 100);
            
            document.getElementById('completed').textContent = checked;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressFill').textContent = percentage + '%';
        }

        function saveCheckboxState() {
            const checkboxes = document.querySelectorAll('.task-checkbox');
            const state = {};
            checkboxes.forEach((cb, index) => {
                state[`task-${index}`] = cb.checked;
            });
            localStorage.setItem('reviewScheduleCheckboxes', JSON.stringify(state));
        }

        function loadCheckboxState() {
            const state = JSON.parse(localStorage.getItem('reviewScheduleCheckboxes') || '{}');
            const checkboxes = document.querySelectorAll('.task-checkbox');
            checkboxes.forEach((cb, index) => {
                if (state[`task-${index}`]) {
                    cb.checked = true;
                    cb.parentElement.classList.add('completed');
                }
            });
        }

        function clearAllCheckboxes() {
            if (confirm('Are you sure you want to clear all checkboxes?')) {
                const checkboxes = document.querySelectorAll('.task-checkbox');
                checkboxes.forEach(cb => {
                    cb.checked = false;
                    cb.parentElement.classList.remove('completed');
                });
                localStorage.removeItem('reviewScheduleCheckboxes');
                updateProgress();
            }
        }

        function jumpToPhase(phaseId) {
            const phaseElement = document.getElementById(phaseId);
            if (phaseElement) {
                phaseElement.classList.remove('collapsed');
                phaseElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Initialize
        renderSchedule();
